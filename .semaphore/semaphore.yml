version: v1.0
name: "JavaScript Package CI"

agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
  containers:
    - name: main
      image: registry.semaphoreci.com/node:20

fail_fast:
  stop:
    when: branch != 'main'

auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'

blocks:
  - name: "JavaScript Checks"
    dependencies: []
    task:
      jobs:
        - name: "Lint"
          commands:
            - checkout
            - npm ci
            - npm run lint
        - name: "Build"
          commands:
            - checkout
            - npm ci
            - npm run build
